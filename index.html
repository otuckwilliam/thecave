<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cave Ledger</title>
<meta name="description" content="Sales, stock, orders and profit for The Cave Liquor House, Sinza.">
<meta name="theme-color" content="#1E1A16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:860px){.pos{grid-template-columns:1fr}}
.searchwrap{position:relative}
.searchwrap input{font-size:18px;padding:14px 14px;border-width:2px;border-radius:12px}
.searchwrap input:focus{border-color:var(--accent);outline:none}
.plist{display:grid;gap:4px;max-height:420px;overflow:auto}
.plist.tall{max-height:520px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 32px;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.prow:hover,.prow.first{border-color:var(--accent);background:var(--accent-soft)}
.prow.out{opacity:.55}
.prow .pp{font-weight:700;color:var(--accent)}
.prow .ps{font-size:12px;color:var(--muted);min-width:52px;text-align:right}
.prow .ps.warn{color:var(--warn)}.prow .ps.bad{color:var(--bad)}
.prow .plus{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
/* best sellers: compact pills so the ticket stays the focus */
.qstrip{display:flex;flex-wrap:wrap;gap:6px}
.qpill{display:inline-flex;align-items:center;gap:8px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;min-height:38px}
.qpill:hover{border-color:var(--accent)}
.qpill .muted{font-weight:400;font-size:12px}
.qpill .qp{color:var(--accent);font-weight:700;font-size:13px}
.qpill.on{border-color:var(--accent);background:var(--accent-soft)}
.qpill .qc{background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:20px;padding:0 6px;font-size:12px;font-weight:800;text-align:center}
.chips.browse{align-items:center}
@media (max-width:860px){
  .qstrip{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;grid-auto-columns:max-content;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
    -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .qstrip::-webkit-scrollbar{display:none}
  .plist{max-height:300px}.plist.tall{max-height:360px}
  .addp{gap:10px}
}
.flash{animation:flash .5s}
@keyframes flash{from{background:var(--accent-soft)}to{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);border:2px solid var(--ink)}
@media (max-width:860px){.ticket{position:static}}
.tlabel{font-size:18px}
.tlines{display:grid;max-height:340px;overflow:auto}
.tline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(90px,auto);gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tline:first-child{border-top:0}
.tline .lt{text-align:right;font-weight:700;white-space:nowrap}
.pin{width:84px!important;padding:3px 6px!important;font-size:13px;display:inline-block}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.paybtn{padding:12px 6px;font-size:14px}
.ghostline{border-style:dashed;background:none}
.tabform{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.daystrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.daystrip{grid-template-columns:1fr}}
.daystrip>div{display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.daystrip .l{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.daystrip b{font-family:var(--display);font-size:24px;letter-spacing:.02em}
.daystrip .warnbox{background:var(--warn-bg)}
.seg3{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;flex-wrap:wrap}
.seg3 button{flex:1;border:0;background:none;padding:9px 10px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg3 button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg3 .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--line);font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tabcard{display:grid;gap:6px;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:12px;background:var(--surface)}
.tabcard.old{border-left-color:var(--bad)}
.tabcard.sel{outline:2px solid var(--accent)}
.tabcard .row{flex-wrap:nowrap}
.paysel{width:auto!important;padding:5px 8px!important;font-size:13px}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:10px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
html,body{margin:0}
img{max-width:100%}
.net{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.net.ok{background:var(--good-bg);color:var(--good)}
.net.wait{background:var(--warn-bg);color:var(--warn)}
.net.off{background:var(--bad-bg);color:var(--bad)}

:root{
  --bg:#F1EFEB; --surface:#FFFFFF; --surface2:#E8E4DD; --ink:#1E1A16; --muted:#6A625A; --line:#D9D3CA;
  --accent:#A45F17; --accent-ink:#FFFFFF; --accent-soft:#F3E4D0;
  --good:#2D7549; --good-bg:#DDEFE3; --warn:#9A6414; --warn-bg:#F6E7C8; --bad:#AE3A2D; --bad-bg:#F6DCD7;
  --shadow:0 1px 2px rgba(30,26,22,.06),0 4px 16px rgba(30,26,22,.06);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14110E; --surface:#1D1915; --surface2:#28231D; --ink:#EFE9E1; --muted:#A59B90; --line:#382F27;
    --accent:#E3A04B; --accent-ink:#1A1109; --accent-soft:#3A2A17;
    --good:#72C492; --good-bg:#1E3527; --warn:#E6B658; --warn-bg:#3A2E15; --bad:#EC8272; --bad-bg:#3D211C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14110E; --surface:#1D1915; --surface2:#28231D; --ink:#EFE9E1; --muted:#A59B90; --line:#382F27;
  --accent:#E3A04B; --accent-ink:#1A1109; --accent-soft:#3A2A17;
  --good:#72C492; --good-bg:#1E3527; --warn:#E6B658; --warn-bg:#3A2E15; --bad:#EC8272; --bad-bg:#3D211C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1040px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--accent)}
.brand .meta{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:18px;display:grid;gap:18px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:13px 16px;font-size:16px;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end;margin:8px 0}
.fbar .f{font-size:13px}
@media (max-width:640px){.fbar{grid-template-columns:1fr 1fr}.fbar label:last-of-type{grid-column:1/-1}}
.sell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
@media (max-width:820px){.sell{grid-template-columns:1fr}.cart{position:static}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pbtn{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;cursor:pointer;display:grid;gap:2px;min-height:78px}
.pbtn:hover{border-color:var(--accent)}
.pbtn b{font-weight:600;line-height:1.25}
.pbtn .p{font-weight:700;color:var(--accent)}
.pbtn .s{font-size:12px;color:var(--muted)}
.pbtn.out{opacity:.6}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.line:first-child{border-top:0}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:700}
.qty span{min-width:24px;text-align:center;font-weight:700}
.priceIn{width:110px!important;padding:6px 8px!important;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:18px;padding-top:6px;border-top:2px solid var(--ink)}
.total .num{font-family:var(--display);font-size:30px;letter-spacing:.02em}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.low{background:var(--warn-bg);color:var(--warn)}
.pill.out{background:var(--bad-bg);color:var(--bad)}
.pill.n{background:var(--surface2);color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:2px}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:.02em;line-height:1.1}
.kpi .l{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .d{font-size:13px;color:var(--muted)}
.kpi.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero .l,.kpi.hero .d{color:var(--bg);opacity:.75}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:20px 8px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.modalBack{position:fixed;inset:0;background:rgba(10,8,6,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
@media (min-width:600px){.modalBack{align-items:center}}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.toast{z-index:90!important;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step{display:grid;gap:2px;font-size:12px;color:var(--muted);position:relative;padding-top:12px}
.step i{position:absolute;top:0;left:0;right:0;height:4px;border-radius:4px;background:var(--surface2)}
.step.on i{background:var(--accent)}.step.on b{color:var(--ink)}
.step.late i{background:var(--bad)}.step.late b,.step.late span{color:var(--bad)}
.step b{font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.grid3{grid-template-columns:1fr}}
.dayhead{padding:10px 0 4px;border-bottom:2px solid var(--ink)}
tr.voided td{color:var(--muted)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 40px}
.lockbox{width:100%;max-width:460px;display:grid;gap:16px;align-content:start}
.lockbrand{font-family:var(--display);font-weight:800;font-size:40px;text-transform:uppercase;letter-spacing:.02em;margin:0;text-align:center}
.lockbrand span{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tile{display:grid;justify-items:center;gap:6px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.tile:hover{border-color:var(--accent)}
.av{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:800}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.opt{border-style:dashed;opacity:.5}.dots i.on{background:var(--ink);opacity:1;border-style:solid}
.lockmsg{min-height:20px;font-size:14px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.pad button{height:64px;font-size:26px;font-weight:700;border:1px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--line)}.pad button:disabled{opacity:.4;cursor:not-allowed}
.pad .ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:18px}
body.locked{overflow:hidden}
/* counter sessions: open → sell → close */
.searchwrap input{font-size:20px;padding:16px 14px}
.counter-start{justify-items:center;text-align:center;padding:36px 16px;gap:16px}
.btn.huge{padding:20px 18px;font-size:20px;width:100%;max-width:420px;border-radius:12px}
.warnb{background:var(--warn-bg);border-color:var(--warn);gap:10px}
.bigempty{font-size:16px;padding:36px 8px}
.counterbar{padding:12px 16px}
.savebtn{padding:18px 16px;font-size:19px}
.ticket .qty button{width:40px;height:40px;font-size:18px}
.closeform{gap:0}
.cstep{display:grid;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.cstep:first-of-type{border-top:0}
.cstep h3{font-size:15px;color:var(--ink);letter-spacing:.02em;text-transform:none;display:flex;align-items:center}
.cstep h3 .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);margin-right:10px;font-size:14px;flex:none}
.cstep p{margin:0}
.moneyin{font-size:20px!important;padding:12px!important;text-align:right}
.credrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.credrow input[type=text]:not(.moneyin){font-size:17px;padding:12px}
.credrow.col{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)}
@media (max-width:560px){.credrow.col{grid-template-columns:1fr 1fr}.credrow.col>div{grid-column:1/-1}}
.sumbox{display:grid;gap:6px;background:var(--surface2);border-radius:12px;padding:14px;margin:14px 0}
.sumrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sumrow.big{font-size:18px;font-weight:700;border-top:2px solid var(--ink);padding-top:8px}
.sumrow.big b{font-family:var(--display);font-size:26px}
.sumrow.good{color:var(--good)}.sumrow.bad{color:var(--bad)}.sumrow.warn{color:var(--warn)}
.bigtick{width:72px;height:72px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;font-size:40px;font-weight:800}
svg text{fill:var(--muted);font-size:11px;font-family:var(--body)}
@media (prefers-reduced-motion:no-preference){.pbtn,.btn,.chip{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>The <span>Cave</span> Ledger</h1>
      <div class="row"><span class="net" id="net">…</span><div class="meta" id="meta">Connecting…</div><button class="btn ghost small" data-act="fullscreen" title="Full screen for the counter">Full screen</button><button class="btn small" data-act="lock" id="lockBtn">Sign out</button></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button data-tab="sell" role="tab">Sell</button>
      <button data-tab="sales" role="tab">Sales</button>
      <button data-tab="reports" role="tab">Reports</button>
      <button data-tab="stock" role="tab">Stock</button>
      <button data-tab="orders" role="tab">Orders</button>
      <button data-tab="expenses" role="tab">Expenses</button>
      <button data-tab="summary" role="tab">Profit</button>
      <button data-tab="history" role="tab">History</button>
      <button data-tab="products" role="tab">Products</button>
